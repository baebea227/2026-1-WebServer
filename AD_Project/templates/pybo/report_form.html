{% extends 'base.html' %}
{% block content %}
<div class="container my-3">
    <h5 class="border-bottom pb-2">{{ target_label }} 신고</h5>
    <div class="card my-3">
        <div class="card-body">
            <div class="card-text" style="white-space: pre-line;">{{ target.content }}</div>
        </div>
    </div>
    <form method="post">
        {% csrf_token %}
        {% include "form_errors.html" %}
        <div class="form-group">
            <label for="reason">{{ form.reason.label }}</label>
            {{ form.reason }}
        </div>
        <div class="form-group">
            <label for="content">{{ form.content.label }}</label>
            {{ form.content }}
        </div>
        <button type="submit" class="btn btn-primary">신고 접수</button>
        <a href="{% url 'pybo:detail' question_id %}" class="btn btn-secondary">취소</a>
    </form>
</div>
{% endblock %}
